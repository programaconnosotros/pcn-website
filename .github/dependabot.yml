# Dependabot avisa de dependencias con vulnerabilidades conocidas y abre PRs para actualizarlas.
# No corre tests en CI: cada PR se revisa y se prueba localmente (pnpm test, pnpm test:db) antes de
# mergearlo. Ver docs/seguridad-owasp.md (A03).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Los PRs se abren contra testing: se prueban ahí antes de pasar a main.
    target-branch: testing
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Las actualizaciones de seguridad se abren siempre; las de versión, agrupadas para que no
    # lleguen 30 PRs sueltos por semana.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # geist stays at 1.3.1: from 1.6 on, Geist Mono is a redesigned typeface that looks like the
    # operating system's monospace font (Menlo / SF Mono), not the Geist Mono the site is designed
    # around. Bump it only on purpose, after checking how the site looks.
    ignore:
      - dependency-name: geist
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    target-branch: testing
    schedule:
      interval: monthly
    labels: [dependencies]
