services:
  mailhog:
    image: mailhog/mailhog:latest
    # Solo se publica para amd64; en Apple Silicon corre emulada
    platform: linux/amd64
    container_name: pcn-mailhog
    restart: always
    ports:
      - '11025:1025' # SMTP
      - '18025:8025' # Web UI

  database:
    image: postgres:13
    container_name: pcn-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: pcn-web
    restart: always
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      # Su propio .next: el del host tiene la caché de Turbopack de otro build y lo hace entrar en pánico
      - /app/.next
    depends_on:
      database:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      # Prisma ofrece versiones nuevas (hasta release candidates) en cada migración
      - PRISMA_HIDE_UPDATE_MESSAGE=true
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - DIRECT_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_CLOUDFRONT_URL=${AWS_CLOUDFRONT_URL}
      # Siempre el MailHog del stack: el SMTP_HOST del .env apunta al localhost de `pnpm dev`, que
      # adentro del contenedor es el propio contenedor
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
